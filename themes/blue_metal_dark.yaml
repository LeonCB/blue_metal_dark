---
#
# Blue Metal Dark Theme
#
Blue Metal Dark:
  modes:
    dark: {}

  # =======================================
  #   UI eXtension
  # =======================================
  uix-theme: "Blue Metal Dark"
  uix-card: |
    #states > div > * {
      font-weight: var(--entity-font-weight) !important;
      text-shadow: var(--entity-text-shadow) !important;
    }
    td {
      text-shadow: var(--entity-text-shadow);
    }
    .card-header {
      text-shadow: var(--card-header-shadow);
    }
    #header__title {
      text-shadow: var(--card-header-shadow);
      font-size: var(--ha-font-size-2xl) !important;
    }
    .sgc-title {
      text-shadow: var(--card-header-shadow);
    }
  uix-card-yaml: |
    clock-weather-card$: |
      clock-weather-card-today-right-wrap {
        width: 90%;
        justify-content: right !important;
      }
      clock-weather-card-today-right-wrap-center {
        font-variant-numeric: tabular-nums;
        margin-right: -3px;
        font-weight: 500;
      }
      clock-weather-card-today-right-wrap-center,
      clock-weather-card-today-right-wrap-bottom {
        justify-content: right !important;
      }
  uix-grid-section-yaml: |
    hui-grid-card$: |
      .card-header {
        text-shadow: var(--card-header-shadow);
      }
    mini-media-player$: |
      ha-card {
        height: var(--mini-media-player-height);
      }
  uix-config-yaml: |
    ha-config-apps-installed $ supervisor-apps-card-content $: |
      :host {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app {
        flex: 1;
        min-height: 0;
      }
      .app > div:not(.icon-wrapper) {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .addition {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        flex: 1 1 0;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-gutter: stable;
      }
      .footer {
        margin-top: auto;
      }
    ha-config-apps-installed $: |
      ha-card {
        height: var(--apps-card-height);
        display: flex;
        flex-direction: column;
      }
      ha-card .card-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
    ha-config-apps-available $ supervisor-apps-repository $: |
      ha-card {
        height: var(--apps-card-height);
        display: flex;
        flex-direction: column;
      }
      ha-card .card-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
    ha-config-apps-available $ $$ supervisor-apps-card-content $: |
      :host {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app {
        flex: 1;
        min-height: 0;
      }
      .app > div:not(.icon-wrapper) {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .addition {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        flex: 1 1 0;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-gutter: stable;
      }
      .footer {
        margin-top: auto;
      }
    ha-config-dashboard $$ ha-list-item-button $: |
      .base:hover {
        --ha-row-item-text-color: var(--hover-text) !important;
        color: var(--hover-text) !important;
        --secondary-text-color: var(--hover-text) !important;
      }
    ha-config-connectivity $$ ha-list-item-button $: |
      .base:hover {
        --ha-row-item-text-color: var(--hover-text) !important;
        color: var(--hover-text) !important;
        --secondary-text-color: var(--hover-text) !important;
      }
    zha-config-dashboard $: |
      ha-md-list-item:hover {
        --md-list-item-label-text-color: var(--hover-text) !important;
        --md-list-item-supporting-text-color: var(--hover-text) !important;
        color: var(--hover-text) !important;
      }
    ha-config-integration-page $ ha-config-entry-row $ ha-config-entry-device-row $: |
      ha-md-list-item:hover {
        --md-list-item-label-text-color: var(--hover-text) !important;
        --md-list-item-supporting-text-color: var(--hover-text) !important;
        color: var(--hover-text) !important;
      }
    cloud-account $ cloud-account-overview $: |
      ha-md-list-item:hover {
        --md-list-item-label-text-color: var(--hover-text) !important;
        --md-list-item-supporting-text-color: var(--hover-text) !important;
        --primary-text-color: var(--hover-text) !important;
        --secondary-text-color: var(--hover-text) !important;
        color: var(--hover-text) !important;
      }
  # =======================================
  #   Variabelen
  # =======================================
  apps-card-height: "120px"
  background-header: "#1e2136"
  card-header-shadow: "2px 2px 2px #000"
  disabled-bg: "#777a83"
  edit-background-header-color: "#0e1020"
  entity-text-shadow: "1px 1px 1px #000"
  font-weight-primary: "400"
  font-weight-secondary: "500"
  ha-line-height-condensed: "1.45"
  hover-text: "#ffffee"
  light-bg-fallback-color: "#fad641"
  mini-media-player-height: "120px"
  primary-font-family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'
  theme-bg-alt: "#18191b"
  theme-bg: "#1d1e20"
  theme-sidebar-icon: "#797d86"
  theme-slider-disabled: "#073288"
  today-color: "var(--primary-color)"
  weekend-color: "#e67c73"

  # =======================================
  #   Entity row styling
  # =======================================
  entity-font-weight: "var(--font-weight-primary)"

  # =======================================
  #   Achtergrond
  # =======================================
  lovelace-background: "radial-gradient(ellipse at 10% 25%, rgba(64, 112, 168, 0.65), transparent 55%), radial-gradient(ellipse at 90% 20%, rgba(185, 40, 120, 0.65), transparent 50%), radial-gradient(ellipse at 50% 75%, rgba(180, 110, 255, 0.6), transparent 65%), #151720 fixed"

  # =======================================
  #   HA core
  # =======================================
  accent-color: "#494b50"
  badge-red: "var(--ha-color-red-30)"
  dark-primary-color: "#94979e"
  disabled-text-color: "#6c6f75"
  error-color: "var(--ha-color-red-50)"
  primary-background-color: "#27282b"
  primary-color: "#2581ab"
  primary-text-color: "#c7c8cb"
  secondary-background-color: "var(--primary-background-color)"
  secondary-text-color: "var(--primary-text-color)"
  state-icon-color: "#6d7178"
  text-primary-color: "var(--primary-text-color)"

  # =======================================
  #   Card
  # =======================================
  card-background-color: "var(--theme-bg)"
  card-primary-font-weight: "var(--font-weight-primary)"
  data-table-background-color: "var(--theme-bg)"
  divider-color: "var(--theme-bg)"
  ha-card-background: "rgba(10, 10, 10, 0.5)"
  ha-card-border-radius: "12px"
  ha-card-border-width: "0"
  ha-card-font-weight: "normal"
  ha-card-header-color: "var(--primary-text-color)"
  ha-ripple-hover-color: "var(--primary-color)"
  ha-ripple-hover-opacity: "0.22"
  ha-ripple-pressed-color: "var(--ha-color-primary-40)"
  ha-ripple-pressed-opacity: "0.05"
  mdc-ripple-color: "var(--primary-color)"
  mdc-ripple-hover-opacity: "0.12"
  label-badge-background-color: "var(--theme-bg)"
  label-badge-border-color: "var(--badge-red)"
  label-badge-red: "var(--badge-red)"
  label-badge-text-color: "var(--primary-text-color)"
  table-row-alternative-background-color: "var(--theme-bg-alt)"
  table-row-background-color: "var(--theme-bg)"

  # =======================================
  #   Dialog
  # =======================================
  ha-dialog-surface-background: "var(--background-header)"

  # =======================================
  #   Header Top
  # =======================================
  app-header-edit-background-color: "var(--edit-background-header-color)"
  app-header-edit-text-color: "#eaebee"

  # =======================================
  #   Footer
  # =======================================
  ha-box-shadow-l: "var(--ha-card-box-shadow)"

  # =======================================
  #   Sidebar
  # =======================================
  sidebar-icon-color: "var(--theme-sidebar-icon)"

  # =======================================
  #   Slider
  # =======================================
  md-slider-active-track-color: "var(--ha-color-primary-60)"
  md-slider-disabled-active-track-color: "var(--theme-slider-disabled)"
  md-slider-disabled-handle-color: "var(--primary-text-color)"
  md-slider-disabled-inactive-track-color: "var(--theme-slider-disabled)"
  md-slider-handle-color: "var(--primary-color)"
  md-slider-inactive-track-color: "rgba(255, 255, 255, 0.2)"

  # =======================================
  #   Toggle / Switch
  # =======================================
  mdc-theme-secondary: "#0d59f2"
  switch-checked-button-color: "#0d59f2"
  switch-checked-track-color: "#3d3f43"
  switch-unchecked-button-color: "#3d3f43"
  switch-unchecked-track-color: "#0c0d0d"

  # =======================================
  #   Typografie
  # =======================================
  ha-card-header-font-family: "var(--primary-font-family)"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-code: "var(--primary-font-family)"
  ha-font-family-longform: "var(--primary-font-family)"
  md-list-item-label-text-font: "var(--primary-font-family)"
  mdc-typography-body1-font-family: "var(--primary-font-family)"
  mdc-typography-button-font-family: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"
  ha-font-size-xs: "10px"
  ha-font-size-s: "12px"
  ha-font-size-m: "14px"
  ha-font-size-l: "15px"
  ha-font-size-xl: "20px"
  ha-font-size-2xl: "25px"
  ha-font-size-3xl: "29px"
  ha-font-size-4xl: "33px"
  ha-font-size-5xl: "42px"
  title-font-size: "20px"
  ha-heading-card-title-font-size: "var(--ha-font-size-l)"

  # =======================================
  #   Primaire kleuren
  # =======================================
  ha-color-primary-05: "#0d1219"
  ha-color-primary-10: "#131c26"
  ha-color-primary-15: "#192532"
  ha-color-primary-20: "#202e3f"
  ha-color-primary-30: "#30455f"
  ha-color-primary-40: "#405d7f"
  ha-color-primary-50: "#6a9ad3"
  ha-color-primary-60: "#8fb4de"
  ha-color-primary-70: "#adc8e7"
  ha-color-primary-80: "#d2e1f2"
  ha-color-primary-90: "#eaf2f9"
  ha-color-primary-95: "#f6f9fc"

  # =======================================
  #   Neutrale kleuren
  # =======================================
  ha-color-neutral-05: "#101316"
  ha-color-neutral-10: "#1a1e22"
  ha-color-neutral-15: "#23282e"
  ha-color-neutral-20: "#2e343b"
  ha-color-neutral-30: "#3d444d"
  ha-color-neutral-40: "#545c66"
  ha-color-neutral-50: "#6f7781"
  ha-color-neutral-60: "#8e959e"
  ha-color-neutral-70: "#adb4bc"
  ha-color-neutral-80: "#c9cfd5"
  ha-color-neutral-90: "#e2e7eb"
  ha-color-neutral-95: "#f0f3f5"

  # =======================================
  #   Rode kleuren (Gevaar/Fout)
  # =======================================
  ha-color-red-05: "#1d0a09"
  ha-color-red-10: "#2e110e"
  ha-color-red-15: "#41130e"
  ha-color-red-20: "#5d160e"
  ha-color-red-30: "#87190f"
  ha-color-red-40: "#c11d0e"
  ha-color-red-50: "#f13b23"
  ha-color-red-60: "#f8644d"
  ha-color-red-70: "#f69685"
  ha-color-red-80: "#f8c5bb"
  ha-color-red-90: "#fbe2dd"
  ha-color-red-95: "#fdf1ef"

  # =======================================
  #   Groene kleuren (Succes)
  # =======================================
  ha-color-green-05: "#0a1c11"
  ha-color-green-10: "#0e2819"
  ha-color-green-15: "#0f3921"
  ha-color-green-20: "#13542d"
  ha-color-green-30: "#17833f"
  ha-color-green-40: "#18c153"
  ha-color-green-50: "#2ce366"
  ha-color-green-60: "#51e57b"
  ha-color-green-70: "#83e89e"
  ha-color-green-80: "#c2f1cd"
  ha-color-green-90: "#e1f7e5"
  ha-color-green-95: "#f1fbf2"

  # =======================================
  #   Oranje kleuren (Waarschuwing)
  # =======================================
  ha-color-orange-05: "#1f1207"
  ha-color-orange-10: "#2f1c0b"
  ha-color-orange-15: "#45290d"
  ha-color-orange-20: "#623a0f"
  ha-color-orange-30: "#945615"
  ha-color-orange-40: "#c67416"
  ha-color-orange-50: "#ed7f0a"
  ha-color-orange-60: "#e5a551"
  ha-color-orange-70: "#e8bf80"
  ha-color-orange-80: "#f0e0c3"
  ha-color-orange-90: "#f7efe1"
  ha-color-orange-95: "#faf7f1"

  # =======================================
  #   ha-color tokens
  # =======================================
  # Rand
  ha-color-border-danger-loud: "var(--ha-color-red-60)"
  ha-color-border-danger-quiet: "var(--ha-color-red-20)"
  ha-color-border-neutral-quiet: "var(--ha-color-neutral-30)"
  ha-color-border-primary-loud: "var(--ha-color-primary-60)"
  ha-color-border-primary-normal: "var(--ha-color-primary-50)"
  ha-color-border-primary-quiet: "var(--ha-color-primary-20)"
  ha-color-border-success-loud: "var(--ha-color-green-60)"
  ha-color-border-success-normal: "var(--ha-color-green-50)"
  ha-color-border-success-quiet: "var(--ha-color-green-20)"
  ha-color-border-warning-loud: "var(--ha-color-orange-60)"
  ha-color-border-warning-quiet: "var(--ha-color-orange-20)"

  # Gevaar/Fout
  ha-color-fill-danger-loud-active: "var(--ha-color-red-60)"
  ha-color-fill-danger-loud-hover: "var(--ha-color-red-50)"
  ha-color-fill-danger-normal-active: "var(--ha-color-red-40)"
  ha-color-fill-danger-normal-hover: "var(--ha-color-red-30)"
  ha-color-fill-danger-normal-resting: "var(--ha-color-red-20)"
  ha-color-fill-danger-quiet-active: "var(--ha-color-red-20)"
  ha-color-fill-danger-quiet-hover: "var(--ha-color-red-15)"
  ha-color-fill-danger-quiet-resting: "var(--ha-color-red-10)"

  # Neutraal - Standaard elementen
  ha-color-fill-neutral-loud-hover: "var(--ha-color-neutral-50)"
  ha-color-fill-neutral-loud-resting: "var(--ha-color-neutral-40)"
  ha-color-fill-neutral-normal-active: "var(--ha-color-neutral-40)"
  ha-color-fill-neutral-normal-hover: "var(--ha-color-neutral-30)"
  ha-color-fill-neutral-normal-resting: "var(--ha-color-neutral-20)"
  ha-color-fill-neutral-quiet-active: "var(--ha-color-neutral-15)"

  # Primair - Accentkleur/Acties
  ha-color-fill-primary-loud-active: "var(--ha-color-primary-60)"
  ha-color-fill-primary-loud-hover: "var(--ha-color-primary-50)"
  ha-color-fill-primary-normal-active: "var(--ha-color-primary-40)"
  ha-color-fill-primary-normal-hover: "var(--ha-color-primary-30)"
  ha-color-fill-primary-normal-resting: "var(--ha-color-primary-20)"
  ha-color-fill-primary-quiet-active: "var(--ha-color-primary-15)"

  # Succes - Gelukt/Veilig
  ha-color-fill-success-loud-active: "var(--ha-color-green-60)"
  ha-color-fill-success-loud-hover: "var(--ha-color-green-50)"
  ha-color-fill-success-normal-active: "var(--ha-color-green-40)"
  ha-color-fill-success-normal-hover: "var(--ha-color-green-30)"
  ha-color-fill-success-normal-resting: "var(--ha-color-green-20)"
  ha-color-fill-success-quiet-active: "var(--ha-color-green-20)"
  ha-color-fill-success-quiet-hover: "var(--ha-color-green-15)"
  ha-color-fill-success-quiet-resting: "var(--ha-color-green-10)"

  # Waarschuwing
  ha-color-fill-warning-loud-active: "var(--ha-color-orange-60)"
  ha-color-fill-warning-loud-hover: "var(--ha-color-orange-50)"
  ha-color-fill-warning-normal-active: "var(--ha-color-orange-40)"
  ha-color-fill-warning-normal-hover: "var(--ha-color-orange-30)"
  ha-color-fill-warning-normal-resting: "var(--ha-color-orange-20)"
  ha-color-fill-warning-quiet-active: "var(--ha-color-orange-20)"
  ha-color-fill-warning-quiet-hover: "var(--ha-color-orange-15)"
  ha-color-fill-warning-quiet-resting: "var(--ha-color-orange-10)"

  # Form achtergrond
  ha-color-form-background-disabled: "var(--ha-color-neutral-10)"

  # =======================================
  #   ha-view
  # =======================================
  ha-view-sections-column-gap: "8px"
  ha-view-sections-row-gap: "8px"

  # =======================================
  #   HACS
  # =======================================
  hacs-badge-color: "var(--accent-color)"
  hacs-badge-text-color: "var(--white-color)"
  hacs-status-installed: "#80b929"
  hacs-status-pending-restart: "#b92938"
  hacs-status-pending-update: "var(--ha-color-orange-50)"
  link-text-color: "var(--accent-color)"

  # =======================================
  #   Mini Media Player
  # =======================================
  mini-media-player-accent-color: "var(--accent-color)"
  mini-media-player-base-color: "var(--primary-text-color)"
  mini-media-player-icon-color: "var(--primary-text-color)"

  # =======================================
  #   Markdown
  # =======================================
  markdown-table-border-collapse: "collapse"
  markdown-table-border-color: "transparent"
  markdown-table-border-style: "none"
  markdown-table-border-width: "0"

  # =======================================
  #   Mdc / invoervelden
  # =======================================
  input-dropdown-icon-color: "var(--theme-sidebar-icon)"
  input-fill-color: "var(--theme-bg)"
  input-label-ink-color: "var(--primary-text-color)"
  input-text-color: "var(--primary-text-color)"
  mdc-button-background-color: "var(--primary-color)"

  # =======================================
  #   CodeMirror
  # =======================================
  codemirror-atom: "#f90"
  codemirror-comment: "#868686"
  codemirror-def: "#7070f9"
  codemirror-keyword: "#b581ff"
  codemirror-number: "#ff822e"
  codemirror-operator: "#ffd90e"
  codemirror-property: "#f25eb8"
  codemirror-string: "#46c8ff"

  # =======================================
  #   Energie
  # =======================================
  energy-battery-in-color: "#c76083"
  energy-battery-out-color: "#57c2e5"
  energy-grid-return-color: "#894aee"
  energy-non-fossil-color: "var(--ha-color-green-60)"
  energy-solar-color: "var(--ha-color-orange-60)"

  # =======================================
  #   Horizon-card
  # =======================================
  hc-primary: "var(--primary-text-color)"

  # =======================================
  #   Mini Graph Card
  # =======================================
  mcg-title-font-weight: "var(--font-weight-primary)"
  mcg-title-letter-spacing: "normal"

  # =======================================
  #   Mushroom
  # =======================================
  mush-card-primary-font-weight: "var(--font-weight-primary)"
  mush-card-secondary-font-weight: "var(--font-weight-secondary)"
  mush-chip-avatar-border-radius: "50%"
  mush-chip-avatar-padding: "0.1em"
  mush-chip-border-radius: "16px"
  mush-chip-font-weight: "var(--font-weight-primary)"
  mush-chip-height: "42px"
  mush-chip-padding: "20px"
  mush-chip-spacing: "16px"
